# 免安裝版本直接發佈到 GitHub Pages（只複製檔案，不 build）
# 依 GitHub 官方範本拆成 build／deploy 兩個 job：同一個 job 裡上傳完立刻部署，
# 曾連續出現「Found 0 artifact(s)」而失敗
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble static site (no build)
        run: |
          mkdir _site
          cp -r src cdn _site/
          cp -r public/. _site/
          cp cdn.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
