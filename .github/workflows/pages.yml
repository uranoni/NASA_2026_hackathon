# 發佈到 GitHub Pages（免 build、免 npm install）
# 把 CDN 版本（cdn.html → index.html）、src/、cdn/ 和 public/ 底下的檔案組成靜態網站後發佈。
# 第一次使用前：Repo Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site (no build)
        run: |
          mkdir _site
          cp -r src cdn _site/
          cp -r public/. _site/
          cp cdn.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
